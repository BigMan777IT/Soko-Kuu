<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soko Kuu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ HOME SCREEN ============ -->
<section id="screen-home" class="screen active">
  <header class="topbar">
    <div class="brand">Soko Kuu</div>
    <div class="location">📍 Dar es Salaam</div>
  </header>

  <div class="search-bar" onclick="goTo('results')">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <span>Tafuta bidhaa...</span>
  </div>

  <div class="category-row" id="category-row"></div>

  <div class="section-title">Bidhaa Mpya</div>
  <div class="product-grid" id="home-products"></div>

  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="goTo('home')">🏠<span>Mwanzo</span></button>
    <button class="nav-btn" onclick="showFavorites()">♡<span>Vipendwa</span></button>
    <button class="nav-btn" onclick="showCargo()">🛒<span>Cargo</span></button>
    <button class="nav-btn" onclick="goTo('register')">👤<span>Akaunti</span></button>
  </nav>
</section>

<!-- ============ RESULTS / SEARCH SCREEN ============ -->
<section id="screen-results" class="screen">
  <header class="topbar">
    <button class="icon-btn" onclick="goTo('home')">←</button>
    <input id="search-input" class="search-input" type="text" placeholder="Tafuta bidhaa..." oninput="renderResults()">
  </header>

  <div class="filter-row">
    <select id="filter-category" onchange="renderResults()">
      <option value="">Kategoria</option>
    </select>
    <select id="filter-type" onchange="renderResults()">
      <option value="">Retail/Wholesale</option>
      <option value="Retail">Retail</option>
      <option value="Wholesale">Wholesale</option>
    </select>
    <label class="verified-toggle">
      <input type="checkbox" id="filter-verified" onchange="renderResults()"> Verified
    </label>
  </div>

  <div class="result-count" id="result-count"></div>
  <div class="result-list" id="results-list"></div>
</section>

<!-- ============ PRODUCT DETAIL SCREEN ============ -->
<section id="screen-detail" class="screen">
  <div class="detail-image">
    <button class="icon-btn floating left" onclick="goTo('results')">←</button>
    <button class="icon-btn floating right" id="detail-like-btn" onclick="toggleLikeCurrent()">♡</button>
  </div>
  <div class="detail-body">
    <div class="tag-row" id="detail-tags"></div>
    <h1 id="detail-name"></h1>
    <div class="detail-price" id="detail-price"></div>
    <div class="seller-card">
      <div class="seller-avatar"></div>
      <div>
        <div class="seller-name" id="detail-seller"></div>
        <div class="seller-location" id="detail-location"></div>
      </div>
    </div>
    <div class="section-title small">Maelezo</div>
    <p class="detail-desc">[Maelezo ya bidhaa yataandikwa na muuzaji hapa]</p>
  </div>
  <div class="detail-actions">
    <button class="icon-action" onclick="toggleCargoCurrent()">🛒</button>
    <button class="primary-btn" id="detail-contact-btn">Wasiliana na Muuzaji</button>
  </div>
</section>

<!-- ============ REGISTER SCREEN ============ -->
<section id="screen-register" class="screen">
  <div class="register-top">
    <div class="progress-label">Hatua 1 kati ya 4</div>
    <div class="progress-bar"><div class="progress-fill"></div><div class="progress-empty"></div><div class="progress-empty"></div><div class="progress-empty"></div></div>
  </div>
  <div class="register-body">
    <h1>Utambulisho Binafsi</h1>
    <p class="muted">Taarifa hizi zinatusaidia kuthibitisha wewe ni nani</p>

    <label>Jina kamili</label>
    <input type="text" id="reg-name" placeholder="Jina kamili">

    <label>Namba ya simu</label>
    <input type="tel" id="reg-phone" placeholder="07xx xxx xxx">

    <label class="block-label">Thibitisha utambulisho</label>
    <div class="id-choice">
      <button class="id-option active" id="opt-nida" onclick="selectIdOption('nida')">
        <div class="id-title">Namba ya NIDA</div>
        <div class="id-sub">Bila kadi</div>
      </button>
      <button class="id-option" id="opt-card" onclick="selectIdOption('card')">
        <div class="id-title">Kitambulisho</div>
        <div class="id-sub">Picha ya kadi</div>
      </button>
    </div>

    <label id="id-input-label">Namba ya NIDA</label>
    <input type="text" id="reg-id-value" placeholder="Namba ya NIDA">
  </div>
  <div class="register-footer">
    <button class="primary-btn" onclick="submitRegister()">Endelea</button>
  </div>
</section>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
